<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Universal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Megrim&display=swap" rel="stylesheet">

<style>
:root{
    /* Colors */
    --secondary:#4ea8ff;
    --important:#ff8a00;
    --gold:#ffd54a;

    /* Background */
    --bg:#05060a;
    --bg2:#090b11;

    /* Cards */
    --card:#11131a;
    --card-hover:#181b24;

    /* Text */
    --text:#f4f7ff;
    --text2:#c7d0df;

    /* Glow */
    --blue-glow:0 0 10px rgba(78,168,255,.15),
                0 0 22px rgba(78,168,255,.25),
                0 0 38px rgba(78,168,255,.18);

    --orange-glow:0 0 10px rgba(255,138,0,.15),
                  0 0 22px rgba(255,138,0,.25),
                  0 0 38px rgba(255,138,0,.18);

    --gold-glow:0 0 10px rgba(255,213,74,.18),
                0 0 25px rgba(255,213,74,.28);

    /* Glass */
    --glass:rgba(17,19,26,.72);
    --glass-border:rgba(255,255,255,.06);

    /* Animation */
    --speed:.28s;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Megrim", sans-serif;
    transition:
        background var(--speed),
        color var(--speed),
        transform var(--speed),
        box-shadow var(--speed),
        border-color var(--speed);
}

body{
    background:linear-gradient(
        180deg,
        var(--bg),
        var(--bg2)
    );

    color:var(--text);
    overflow-x:hidden;
    min-height:100vh;
}

/* ---------- EASY BACKGROUND ---------- */

.background{
    position:fixed;
    inset:0;
    z-index:-999;
    overflow:hidden;
}

#background-image{
    width:100%;
    height:100%;
    object-fit:cover;
    animation:floatBg 20s ease-in-out infinite;
    filter:brightness(.55);
}

@keyframes floatBg{
    0%{
        transform:scale(1.05) translateY(0px);
    }

    50%{
        transform:scale(1.08) translateY(-10px);
    }

    100%{
        transform:scale(1.05) translateY(0px);
    }
}

/* ---------- HEADER ---------- */

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 28px;

    position:sticky;
    top:0;
    z-index:50;

    backdrop-filter:blur(18px);

    background:rgba(8,10,18,.45);

    border-bottom:1px solid rgba(255,255,255,.05);
}

.logo{
    font-size:2rem;
    font-weight:bold;
    background:
    linear-gradient(
    90deg,
    var(--secondary),
    var(--important));
    -webkit-background-clip:text;
    color:transparent;
}

.search{
    width:42%;
    padding:14px 18px;

    border-radius:16px;
    border:1px solid rgba(255,255,255,.08);

    background:rgba(255,255,255,.06);

    color:var(--text);

    outline:none;

    backdrop-filter:blur(18px);

    font-size:.95rem;

    transition:.25s;
}

.search::placeholder{
    color:#9aa8bf;
}

.search:hover{
    border-color:rgba(78,168,255,.25);

    box-shadow:
        0 0 12px rgba(78,168,255,.15);
}

.search:focus{

    border-color:var(--secondary);

    box-shadow:
        0 0 15px rgba(78,168,255,.35),
        0 0 35px rgba(78,168,255,.18);
}

.menu-btn{

    font-size:2rem;

    cursor:pointer;

    color:var(--important);

    padding:8px;

    border-radius:12px;

}

.menu-btn:hover{

    color:#fff;

    background:rgba(255,138,0,.08);

    box-shadow:
        0 0 15px rgba(255,138,0,.30);

}

/* ---------- MENU ---------- */

.menu{
    position:fixed;

    left:-340px;
    top:0;

    width:320px;
    height:100vh;

    padding:30px;

    background:rgba(10,12,18,.82);

    backdrop-filter:blur(25px);

    border-right:1px solid rgba(255,255,255,.06);

    transition:.35s ease;

    z-index:999;
}

.menu.open{
    left:0;
}

.menu h2{

    color:var(--secondary);

    font-size:2rem;

    margin-bottom:25px;

    letter-spacing:2px;

}

.menu button{

    width:100%;

    margin:10px 0;

    padding:14px;

    border:none;

    border-radius:16px;

    background:rgba(255,255,255,.05);

    color:var(--text);

    cursor:pointer;

    font-size:1rem;

}

.menu button:hover{

    background:rgba(78,168,255,.12);

    box-shadow:
        0 0 15px rgba(78,168,255,.25),
        0 0 35px rgba(78,168,255,.10);

    transform:translateX(8px);

}

.menu-version{

    color:#9aa8bf;

    margin-bottom:25px;

    line-height:1.6;

    font-size:.9rem;

    opacity:.8;

}

/* ---------- TITLES ---------- */

.section-title{
    padding:20px 30px;
    color:var(--secondary);
}

/* ---------- GAME GRID ---------- */

.games-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    padding:0 30px 30px;
}

.game-card{

    background:rgba(17,19,26,.78);

    border:1px solid rgba(255,255,255,.05);

    border-radius:22px;

    overflow:hidden;

    position:relative;

    cursor:pointer;

    backdrop-filter:blur(18px);

    transition:.3s;

}

.game-card::before{

    content:"";

    position:absolute;

    top:0;
    left:-120%;

    width:60%;
    height:100%;

    background:
        linear-gradient(
            120deg,
            transparent,
            rgba(255,255,255,.12),
            transparent
        );

    transform:skewX(-25deg);

    transition:left .6s ease;

    pointer-events:none;

}

.game-card:hover::before{

    left:160%;

}

.game-card:hover{

    transform:
        translateY(-10px)
        scale(1.03);

    border-color:
        rgba(78,168,255,.35);

    box-shadow:
        0 0 20px rgba(78,168,255,.45),
        0 0 45px rgba(78,168,255,.30),
        0 0 90px rgba(78,168,255,.15);

}

.game-card img{

    width:100%;

    height:190px;

    object-fit:cover;

    display:block;

    transition:
    transform .25s ease,
    box-shadow .25s ease,
    border-color .25s ease;

}

.game-info{
    padding:15px;
}

.game-title{

    color:var(--important);

    font-size:1.2rem;

    transition:.3s;

}

.game-card:hover{

    transform:
        translateY(-8px)
        scale(1.04);

    box-shadow:
        0 0 20px rgba(78,168,255,.35),
        0 0 45px rgba(78,168,255,.45),
        0 0 80px rgba(78,168,255,.20);

}

.game-desc{
    color:#ccc;
    margin-top:8px;
}

.game-card:hover .play-overlay{

    opacity:1;

}

.game-card:hover .game-image img{

    transform:scale(1.08);

}

.game-image img{

    width:100%;

    height:100%;

    object-fit:cover;

    transition:transform .35s ease;

}

.play-overlay{

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    background:rgba(0,0,0,.35);

    color:white;

    font-size:1.3rem;

    font-weight:bold;

    letter-spacing:2px;

    opacity:0;

    transition:.3s;

    backdrop-filter:blur(2px);

}

/* ---------- PLAYER ---------- */

#game-player{
    display:none;
    position:fixed;
    inset:0;
    background:#000;
    z-index:9999;
}

.player-top{
    display:flex;
    justify-content:space-between;
    padding:10px;
    background:#111;
}

.player-top button{
    padding:10px 15px;
    border:none;
    border-radius:12px;
    background:var(--secondary);
    color:white;
    cursor:pointer;
}

iframe{
    width:100%;
    height:calc(100vh - 60px);
    border:none;
}

/* ---------- MOBILE ---------- */

@media(max-width:900px){

.games-grid{
grid-template-columns:
repeat(2,1fr);
}

.search{
width:55%;
}

}
</style>
</head>

<!-- BACKGROUND -->

<div class="background">

<img
id="background-image"
src=""
alt="Background">

</div>

<!-- MENU -->

<div class="menu"
id="menu">

<h2>Universal</h2>

<div class="menu-version">
    new ui + settings and games
    <br>
    Version 2.3
</div>

<button onclick="randomGame()">
🎲 Random Game
</button>

<button onclick="toggleFocus()">
👀 Focus Mode
</button>

<button onclick="showUpdates()">
📜 Update Log
</button>

<button onclick="showCredits()">
🙌 Credits
</button>

<button onclick="toggleMenu()">
❌ Close
</button>

</div>

<!-- HEADER -->

<header>

<div>
<span
class="menu-btn"
onclick="toggleMenu()">
☰
</span>

<span class="logo">
Universal
</span>
</div>

<input
type="text"
class="search"
placeholder="Search games..."
id="search"
onkeyup="searchGames()">

</header>

<!-- CONTINUE PLAYING -->

<h2 class="section-title">
Continue Playing
</h2>

<div
class="games-grid"
id="continue-grid">
</div>

<!-- GAMES -->

<h2 class="section-title">
All Games
</h2>

<div
class="games-grid"
id="games-grid">
</div>

<!-- PLAYER -->

<div id="game-player">

<div class="player-top">

<button onclick="closeGame()">
⬅ Back
</button>

<button onclick="fullscreenGame()">
⛶ Fullscreen
</button>

</div>

<iframe
id="game-frame"
allowfullscreen>
</iframe>

</div>

<script>
document
.getElementById(
"background-image"
).src =
BACKGROUND_IMAGE;

const grid =
document.getElementById(
"games-grid"
);

const continueGrid =
document.getElementById(
"continue-grid"
);

function loadGames(
list = games
){

grid.innerHTML = "";

list.forEach(game=>{

const card =
document.createElement(
"div"
);

card.className =
"game-card";

card.innerHTML = `
<img src="${game.image}">
<div class="game-info">
<div class="game-title">
${game.title}
</div>

<div class="game-desc">
${game.description}
</div>
</div>
`;

card.onclick =
()=>launchGame(game);

grid.appendChild(card);

});

}

function launchGame(game){

    // Open Google Sites in a new tab
    if(game.link.includes("sites.google.com")){

        window.open(game.link, "_blank");

        localStorage.setItem(
            "continueGame",
            JSON.stringify(game)
        );

        loadContinue();
        return;
    }

    document.getElementById("game-player").style.display = "block";
    document.getElementById("game-frame").src = game.link;

    localStorage.setItem(
        "continueGame",
        JSON.stringify(game)
    );

    loadContinue();

}

function closeGame(){

document
.getElementById(
"game-player"
)
.style.display =
"none";

document
.getElementById(
"game-frame"
)
.src = "";

}

function fullscreenGame(){

const player =
document
.getElementById(
"game-player"
);

if(player.requestFullscreen){
player.requestFullscreen();
}
else if(
player.webkitRequestFullscreen
){
player.webkitRequestFullscreen();
}

}

function toggleMenu(){

document
.getElementById(
"menu"
)
.classList.toggle(
"open"
);

}

function toggleFocus(){

const bg =
document
.getElementById(
"background-image"
);

CONFIG.focusMode =
!CONFIG.focusMode;

bg.style.filter =
CONFIG.focusMode
? "blur(10px) brightness(.4)"
: "brightness(.55)";
}

function searchGames(){

const value =
document
.getElementById(
"search"
)
.value
.toLowerCase();

const filtered =
games.filter(
game =>
game.title
.toLowerCase()
.includes(value)
);

loadGames(filtered);
}

function randomGame(){

if(games.length === 0)
return;

const random =
games[
Math.floor(
Math.random() *
games.length
)
];

launchGame(random);

}

function showUpdates(){

alert(
updates.join("\n")
);

}

function showCredits(){

alert(
`Credits

Foundation Games (my other website)`
);

}

function loadContinue(){

const saved =
localStorage.getItem(
"continueGame"
);

continueGrid.innerHTML =
"";

if(saved){

const game =
JSON.parse(saved);

const card =
document.createElement(
"div"
);

card.className =
"game-card";

card.innerHTML = `
<div class="game-image">
    <img src="${game.image}">
    <div class="play-overlay">
        ▶ PLAY
    </div>
</div>

<div class="game-info">
    <div class="game-title">${game.title}</div>
    <div class="game-desc">${game.description}</div>
</div>
`;


card.onclick =
()=>launchGame(game);

continueGrid
.appendChild(card);

}

}

loadGames();
loadContinue();

</script>
